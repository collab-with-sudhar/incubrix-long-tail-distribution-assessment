services:
  # IncuBrix Distribution Connector Service
  incubrix-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-service
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SIMULATION_MODE=false
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=./data/storage
      - GHOST_API_URL=http://ghost:2368
      - GHOST_ADMIN_API_KEY=6ad64aec7fae85000163eb45:084b512876b4e5048edb65c747b1b6152830e30b8c8d280f8d7bf7491e8ae3cb
      - LEMMY_INSTANCE_URL=http://lemmy:8536
      - LEMMY_USERNAME=incubrix_admin
      - LEMMY_PASSWORD=incubrix_password_123
      - DEVTO_API_KEY=${DEVTO_API_KEY:-mock_devto_key}
      - DISCOURSE_BASE_URL=http://localhost:3000/mock/discourse
      - DISCOURSE_API_KEY=mock_discourse_key
      - DISCOURSE_API_USERNAME=system
      - WEBHOOK_HMAC_SECRET=incubrix_super_secret_webhook_key_2026
      - INCUBRIX_CALLBACK_SECRET=incubrix_callback_hmac_signing_key
    depends_on:
      - ghost
      - lemmy
      - redis
    restart: unless-stopped

  # Local Ghost Blog (Must-Have 8)
  ghost:
    image: ghost:5-alpine
    container_name: incubrix-ghost
    ports:
      - "2368:2368"
    environment:
      - url=http://localhost:2368
      - NODE_ENV=development
    restart: unless-stopped

  # Local Lemmy Database
  lemmy-postgres:
    image: postgres:15-alpine
    container_name: incubrix-lemmy-postgres
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=lemmy_secret
      - POSTGRES_DB=lemmy
    volumes:
      - lemmy_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Local Lemmy Instance (Must-Have 8)
  lemmy:
    image: dessalines/lemmy:0.19.5
    container_name: incubrix-lemmy
    ports:
      - "8536:8536"
    environment:
      - RUST_LOG=info
    volumes:
      - ./lemmy/lemmy.hjson:/config/config.hjson:ro
    depends_on:
      - lemmy-postgres
    restart: unless-stopped

  # Redis for Caching & Idempotency
  redis:
    image: redis:7-alpine
    container_name: incubrix-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  lemmy_pg_data:
