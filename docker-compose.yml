version: '3.8'

services:
  # IncuBrix Distribution Connector Service
  incubrix-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SIMULATION_MODE=false
      - GHOST_API_URL=http://ghost:2368
      - GHOST_ADMIN_API_KEY=654321098765432109876543:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - LEMMY_INSTANCE_URL=http://lemmy:8536
      - LEMMY_USERNAME=incubrix_admin
      - LEMMY_PASSWORD=incubrix_password_123
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=incubrix-artifacts
    depends_on:
      - ghost
      - lemmy
      - minio
      - redis
    restart: unless-stopped

  # Local Ghost Blog (Must-Have 8)
  ghost:
    image: ghost:5-alpine
    container_name: incubrix-ghost
    ports:
      - "2368:2368"
    environment:
      - url=http://localhost:2368
      - NODE_ENV=development
    restart: unless-stopped

  # Local Lemmy Database
  lemmy-postgres:
    image: postgres:15-alpine
    container_name: incubrix-lemmy-postgres
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=lemmy_secret
      - POSTGRES_DB=lemmy
    volumes:
      - lemmy_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Local Lemmy Instance (Must-Have 8)
  lemmy:
    image: dessalines/lemmy:0.19.5
    container_name: incubrix-lemmy
    ports:
      - "8536:8536"
    environment:
      - RUST_LOG=info
    depends_on:
      - lemmy-postgres
    restart: unless-stopped

  # Local S3 Storage (Integration Standard 7)
  minio:
    image: minio/minio:latest
    container_name: incubrix-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Redis for Caching & Idempotency
  redis:
    image: redis:7-alpine
    container_name: incubrix-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  lemmy_pg_data:
  minio_data:
