services:
  # IncuBrix Distribution Connector Service
  incubrix-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SIMULATION_MODE=false
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=./data/storage
      - GHOST_API_URL=http://ghost:2368
      - GHOST_ADMIN_API_KEY=654321098765432109876543:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      - LEMMY_INSTANCE_URL=http://lemmy:8536
      - LEMMY_USERNAME=incubrix_admin
      - LEMMY_PASSWORD=incubrix_password_123
    depends_on:
      - ghost
      - lemmy
      - redis
    restart: unless-stopped

  # Local Ghost Blog (Must-Have 8)
  ghost:
    image: ghost:5-alpine
    container_name: incubrix-ghost
    ports:
      - "2368:2368"
    environment:
      - url=http://localhost:2368
      - NODE_ENV=development
    restart: unless-stopped

  # Local Lemmy Database
  lemmy-postgres:
    image: postgres:15-alpine
    container_name: incubrix-lemmy-postgres
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=lemmy_secret
      - POSTGRES_DB=lemmy
    volumes:
      - lemmy_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Local Lemmy Instance (Must-Have 8)
  lemmy:
    image: dessalines/lemmy:0.19.5
    container_name: incubrix-lemmy
    ports:
      - "8536:8536"
    environment:
      - RUST_LOG=info
    depends_on:
      - lemmy-postgres
    restart: unless-stopped

  # Redis for Caching & Idempotency
  redis:
    image: redis:7-alpine
    container_name: incubrix-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  lemmy_pg_data:
