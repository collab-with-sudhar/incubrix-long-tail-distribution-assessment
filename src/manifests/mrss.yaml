key: mrss
version: 1.0.0
tier: feed
auth: none
surfaces:
  - key: video_feed
    content_types:
      - video
      - xml
      - text
    spec:
      title_max_chars: 255
      body_max_chars: 5000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
error_map:
  "400": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: feed_url
