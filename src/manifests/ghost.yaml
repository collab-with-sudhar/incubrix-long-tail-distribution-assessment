key: ghost
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types:
      - html
      - markdown
      - image
    spec:
      title_max_chars: 255
      body_max_chars: 100000
      links_allowed: true
      media_max_count: 20
rate_limits:
  per_connection:
    requests: 100
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
  - metrics
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url
