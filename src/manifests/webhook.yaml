key: webhook
version: 1.0.0
tier: bridge
auth: none
surfaces:
  - key: event
    content_types:
      - json
      - text
    spec:
      body_max_chars: 1000000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities:
  - publish
  - status
  - delete
error_map:
  "429": PLATFORM_RATE_LIMIT
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: target_url
