key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_pack
    content_types:
      - text
      - image
      - video
    spec:
      title_max_chars: 500
      body_max_chars: 50000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 200
    per_seconds: 60
capabilities:
  - assist_pack
  - validate
error_map:
  "400": PLATFORM_CONTENT_REJECTED
